# Repository settings for event-finder
# This file can be used with the Probot Settings app to configure repository settings
# See https://github.com/probot/settings

repository:
  name: event-finder
  description: Full-stack event discovery app using React, TypeScript, Express, and the Ticketmaster API
  homepage: https://event-finder.vercel.app
  topics: react, typescript, express, ticketmaster, api, events
  
  # Privacy and security
  private: false
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  
  # Merge settings
  allow_squash_merge: true
  allow_merge_commit: false  # Require linear history
  allow_rebase_merge: true

  # Auto-delete head branches after merge
  delete_branch_on_merge: true

# Branch protection rules
branches:
  - name: main
    protection:
      # Require pull request reviews before merging
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: false
        require_code_owner_reviews: false
        
      # Require status checks to pass before merging
      required_status_checks:
        strict: true
        contexts:
          - test-and-lint

      # Enforce all configured restrictions for administrators
      # Set to false to allow administrators emergency access if needed
      enforce_admins: false

      # Require linear history for cleaner git history
      required_linear_history: true

      # Prevent force pushes
      allow_force_pushes: false

      # Prevent branch deletion
      allow_deletions: false

      # Require conversation resolution before merging
      required_conversation_resolution: true
